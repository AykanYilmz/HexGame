# ---------------------------------------------------------------- rules
rules.title=How to play
rules.step1=Take turns placing a stone on any empty hexagon. Red goes first.
rules.step2=Red tries to build an unbroken chain linking the left and right edges, blue one linking the top and bottom edges.
rules.step3=Every hexagon has six neighbours, and chains run through these neighbours.
rules.step4=Hex has no draws: someone always wins before the board fills up.
rules.step5=With the swap rule on, blue may turn red's first stone into its own colour on its first move, which punishes an opening that is too strong.
rules.tip=Tip: a “bridge” (two stones sharing two empty neighbours) cannot be cut. It is the strongest tactic in the game.
rules.ok=Got it

