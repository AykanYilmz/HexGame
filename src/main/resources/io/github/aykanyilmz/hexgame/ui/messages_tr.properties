# ---------------------------------------------------------------- rules
rules.title=Nasıl oynanır?
rules.step1=Sırayla boş bir altıgene taş koyun. Kırmızı başlar.
rules.step2=Kırmızı sol ve sağ kenarı, mavi üst ve alt kenarı birleştiren kesintisiz bir zincir kurmaya çalışır.
rules.step3=Her altıgenin altı komşusu vardır. Zincir bu komşuluklar üzerinden ilerler.
rules.step4=Hex'te beraberlik yoktur: tahta dolmadan biri mutlaka kazanır.
rules.step5=Takas kuralı açıksa mavi ilk hamlesinde kırmızının taşını kendi rengine çevirebilir. Böylece güçlü bir açılış cezalandırılır.
rules.tip=İpucu: iki taş arasında iki ortak boş komşu bırakan “köprü” hamlesi kesilemez. Oyunun en güçlü taktiğidir.
